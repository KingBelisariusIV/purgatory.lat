
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisu Converter</title>
<style>
body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}
.boxes {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.box {
    flex: 1;
    min-width: 230px;
}
label { display: block; margin-bottom: 8px; }
textarea {
    box-sizing: border-box;
    width: 100%;
    height: 180px;
    padding: 12px;
    font: 18px sans-serif;
    border: 1px solid #ccc;
    border-radius: 5px;
}
#output { font-size: 24px; }
button {
    margin-top: 12px;
    padding: 8px 14px;
    cursor: pointer;
}
footer {
    margin-top: 30px;
    font-size: 14px;
}
a { color: #444; }
</style>
</head>
<body>

<h2>Lisu Converter</h2>

<div class="boxes">
    <div class="box">
        <label for="input">Latin Text</label>
        <textarea id="input" placeholder="Type here..."></textarea>
    </div>
    <div class="box">
        <label for="output">Lisu Unicode</label>
        <textarea id="output" readonly></textarea>
    </div>
</div>

<button id="copy">Copy Output</button>
<button id="clear">Clear</button>

<footer>
    <p>Discord: <a href="https://discord.gg/giga">discord.gg/giga</a></p>
    <p>Contact: <strong>kingbelisariusix4 (On Discord)</strong></p>
    <p>Info: This is a website dedicated to bypassing common text filters on discord</p>
</footer>

<script>
const mapping = {
    a:"ꓮ", b:"ꓐ", c:"ꓚ", d:"ꓓ", e:"ꓰ",
    f:"ꓝ", g:"ꓖ", h:"ꓧ", i:"ꓲ", j:"ꓙ",
    k:"ꓗ", l:"ꓡ", m:"ꓟ", n:"ꓠ", o:"ꓳ",
    p:"ꓑ", q:"ꓣ", r:"ꓣ", s:"ꓢ", t:"ꓔ",
    u:"ꓴ", v:"ꓦ", w:"ꓪ", x:"ꓫ", y:"ꓬ",
    z:"ꓜ"
};

const input = document.getElementById("input");
const output = document.getElementById("output");

input.addEventListener("input", () => {
    output.value = [...input.value]
        .map(c => mapping[c.toLowerCase()] || c)
        .join("");
});

document.getElementById("copy").onclick = async () => {
    try {
        await navigator.clipboard.writeText(output.value);
    } catch {
        output.select();
        document.execCommand("copy");
    }
};

document.getElementById("clear").onclick = () => {
    input.value = "";
    output.value = "";
    input.focus();
};
</script>

</body>
</html>
